name: Sync official legislator directory baseline
on:
  workflow_dispatch:
  schedule:
    - cron: '25 15 * * 1'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve and validate official Texas LRL directory
        run: node scripts/sync-official-legislators.cjs
      - name: Commit updated official baseline if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislators-89-official.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official Texas LRL legislator baseline"
            git push
          fi
