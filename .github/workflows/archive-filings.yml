name: Archive official daily filed-bill reports
on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Capture reports with validation
        run: node scripts/snapshot-filings.cjs
      - name: Commit changed snapshot
        run: |
          git add data/filings/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive verified daily bill filings"
          git push
