name: Refresh Texas filed bills
on:
  schedule:
    # Run at 9 AM and 5 PM Central Standard Time (10 AM / 6 PM during daylight saving).
    # GitHub schedules may start late; do not skip the actual refresh based on clock hour.
    - cron: '0 15,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: texas-bill-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate official-source bill feed
        env:
          FEED_URL: https://texascapitolwatch.vercel.app/api/todays-bills
        run: |
          mkdir -p data
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response=await fetch(process.env.FEED_URL+'?scheduled='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
          if(!response.ok)throw Error('Feed HTTP '+response.status);
          const feed=await response.json();
          if(feed.partial||feed.mode!=='session'||!Array.isArray(feed.bills)||feed.bills.length<100)
            throw Error('Refusing to publish incomplete bill feed');
          const unique=new Set(feed.bills.map(b=>b.bill));
          if(unique.size!==feed.bills.length)throw Error('Duplicate bill identifiers');
          const file='data/todays-bills.json';
          if(fs.existsSync(file)){
            const previous=JSON.parse(fs.readFileSync(file,'utf8'));
            if(feed.bills.length<previous.bills.length)
              throw Error('Bill count unexpectedly decreased: '+feed.bills.length+' < '+previous.bills.length);
          }
          fs.writeFileSync(file,JSON.stringify({...feed,scheduledRefreshAt:new Date().toISOString()})+'\n');
          console.log('Validated '+feed.bills.length+' filed bills at '+new Date().toISOString());
          NODE
      - name: Commit updated bill snapshot
        run: |
          git config user.name "Texas Capitol Watchdog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/todays-bills.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Texas filed bills"
            git push
          fi
  alert:
    needs: refresh
    if: ${{ always() && needs.refresh.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update refresh failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GH_REPO" --state open --search 'Bill refresh failed in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "Another scheduled bill refresh failed: $RUN_URL"
          else
            gh issue create --repo "$GH_REPO" --title "Bill refresh failed" --body "The scheduled Texas bill snapshot refresh failed. Investigate the run: $RUN_URL. The previous verified snapshot should remain available."
          fi
