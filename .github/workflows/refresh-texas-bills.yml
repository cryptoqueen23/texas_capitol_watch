name: Refresh Texas filed bills
on:
  schedule:
    # 9 AM and 5 PM America/Chicago, covering CST and CDT.
    - cron: '0 14,15,22,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: texas-bill-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Texas local scheduled hour
        id: texas
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hour=$(TZ=America/Chicago date +%H)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$hour" = "09" ] || [ "$hour" = "17" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download and validate official-source bill feed
        if: steps.texas.outputs.run == 'true'
        env:
          FEED_URL: https://texascapitolwatch.vercel.app/api/todays-bills
        run: |
          mkdir -p data
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response=await fetch(process.env.FEED_URL+'?scheduled='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
          if(!response.ok)throw Error('Feed HTTP '+response.status);
          const feed=await response.json();
          if(feed.partial||feed.mode!=='session'||!Array.isArray(feed.bills)||feed.bills.length<100)
            throw Error('Refusing to publish incomplete bill feed');
          const unique=new Set(feed.bills.map(b=>b.bill));
          if(unique.size!==feed.bills.length)throw Error('Duplicate bill identifiers');
          const file='data/todays-bills.json';
          if(fs.existsSync(file)){
            const previous=JSON.parse(fs.readFileSync(file,'utf8'));
            if(feed.bills.length<previous.bills.length)
              throw Error('Bill count unexpectedly decreased: '+feed.bills.length+' < '+previous.bills.length);
          }
          fs.writeFileSync(file,JSON.stringify({...feed,scheduledRefreshAt:new Date().toISOString()})+'\n');
          console.log('Validated '+feed.bills.length+' filed bills');
          NODE
      - name: Commit updated bill snapshot
        if: steps.texas.outputs.run == 'true'
        run: |
          git config user.name "Texas Capitol Watchdog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/todays-bills.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Texas filed bills"
            git push
          fi
