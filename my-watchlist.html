<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bill Watchlist | Texas Capitol Watchdog</title><style>:root{font-family:system-ui,sans-serif;background:#0b1120;color:#e9edf5}*{box-sizing:border-box}body{margin:0}main,header{max-width:900px;margin:auto;padding:18px}a{color:#f5c45c}button{background:#f5c45c;color:#101827;border:0;border-radius:8px;padding:12px;min-height:44px;font-weight:700;cursor:pointer}button.secondary{background:#243650;color:#fff;border:1px solid #7082a0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f5c45c;outline-offset:3px}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.card{background:#16243b;border:1px solid #405473;border-radius:12px;padding:18px;margin:14px 0;overflow-wrap:anywhere}.muted{color:#c5cfdf}h1{font-size:clamp(1.8rem,5vw,2.5rem)}.new{color:#ffdc7e;font-weight:700}.hidden{display:none}</style></head><body><header><a href="/">← Texas Capitol Watchdog</a> · <a href="/todays-bills.html" id="all">All filed bills</a><div class="tools"><button id="en" class="secondary" aria-pressed="true">🇺🇸 EN</button><button id="es" class="secondary" aria-pressed="false">🇵🇷 ES</button></div></header><main><h1 id="title">My Bill Watchlist</h1><p id="intro" class="muted">Saved only in this browser. No account or database. Clearing browser data may erase your watchlist. Export a backup before switching devices.</p><div class="tools"><button id="export">Export watchlist</button><button id="import" class="secondary">Import watchlist</button><input id="file" class="hidden" type="file" accept=".json,application/json" aria-label="Import watchlist JSON"><button id="refresh" class="secondary">Check for new activity</button></div><p id="message" role="status" aria-live="polite"></p><h2 id="count">Saved bills: 0</h2><div id="list"></div></main><script src="/watchlist.js"></script><script>
const W=window.TCWWatch,els=id=>document.getElementById(id);let lang=localStorage.getItem('tcw_lang')==='es'?'es':'en';const t=(en,es)=>lang==='es'?es:en;let live=new Map(),checking=false;
function render(){document.documentElement.lang=lang;els('title').textContent=t('My Bill Watchlist','Mi lista de seguimiento');els('all').textContent=t('All filed bills','Todos los proyectos');els('intro').textContent=t('Saved only in this browser. No account or database. Clearing browser data may erase your watchlist. Export a backup before switching devices.','Guardada solo en este navegador. Sin cuenta ni base de datos. Borrar los datos del navegador puede eliminar la lista. Exporta una copia antes de cambiar de dispositivo.');els('export').textContent=t('Export watchlist','Exportar lista');els('import').textContent=t('Import watchlist','Importar lista');els('refresh').textContent=t('Check for new activity','Consultar nueva actividad');els('en').setAttribute('aria-pressed',String(lang==='en'));els('es').setAttribute('aria-pressed',String(lang==='es'));const items=W.read();els('count').textContent=t('Saved bills: ','Proyectos guardados: ')+items.length;const root=els('list');root.replaceChildren();if(!items.length){const p=document.createElement('p');p.textContent=t('No saved bills yet. Open any bill and select Save bill.','Todavía no hay proyectos guardados. Abre un proyecto y selecciona Guardar proyecto.');root.append(p)}for(const x of items){const card=document.createElement('article');card.className='card';const h=document.createElement('h3'),a=document.createElement('a');a.href='/bill.html?bill='+encodeURIComponent(x.bill)+'&session='+encodeURIComponent(x.session);a.textContent=x.bill+' · '+x.session;h.append(a);card.append(h);if(x.caption){const p=document.createElement('p');p.textContent=x.caption;card.append(p)}const d=live.get(x.session+':'+x.bill);if(d&&d.verified){const action=String(d.lastAction||'');const changed=!!x.lastSeenAction&&!!action&&action!==x.lastSeenAction;const p=document.createElement('p');p.textContent=t('Latest official action: ','Última acción oficial: ')+(action||t('Not available','No disponible'));card.append(p);if(changed){const flag=document.createElement('p');flag.className='new';flag.textContent=t('● New activity since your last check','● Nueva actividad desde tu última consulta');card.append(flag);const seen=document.createElement('button');seen.className='secondary';seen.textContent=t('Mark activity as seen','Marcar actividad como vista');seen.onclick=()=>{W.markSeen(x.bill,x.session,action);render()};card.append(seen)}else if(!x.lastSeenAction&&action){const seen=document.createElement('button');seen.className='secondary';seen.textContent=t('Set current activity as baseline','Establecer actividad actual como referencia');seen.onclick=()=>{W.markSeen(x.bill,x.session,action);render()};card.append(seen)}}else if(d){const p=document.createElement('p');p.className='muted';p.textContent=t('Status unavailable. Check official bill history.','Estado no disponible. Consulta el historial oficial.');card.append(p)}const remove=document.createElement('button');remove.className='secondary';remove.style.margin='10px';remove.textContent=t('Remove saved bill','Quitar proyecto');remove.onclick=()=>{W.toggle(x.bill,x.session);live.delete(x.session+':'+x.bill);render()};card.append(remove);root.append(card)}}
async function check(){if(checking)return;checking=true;els('refresh').disabled=true;const items=W.read();els('message').textContent=t('Checking official statuses…','Consultando estados oficiales…');let next=0,ok=0;async function worker(){while(next<items.length){const x=items[next++],key=x.session+':'+x.bill;try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);let r;try{r=await fetch('/api/bill-status?bill='+encodeURIComponent(x.bill)+'&session='+encodeURIComponent(x.session),{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timeout)}const d=await r.json();live.set(key,r.ok&&d.verified?d:{verified:false});if(r.ok&&d.verified)ok++}catch{live.set(key,{verified:false})}render()}}await Promise.all(Array.from({length:Math.min(4,items.length)},worker));els('message').textContent=t('Official statuses verified: ','Estados oficiales verificados: ')+ok+'/'+items.length;els('refresh').disabled=false;checking=false}
els('en').onclick=()=>{lang='en';localStorage.setItem('tcw_lang',lang);render()};els('es').onclick=()=>{lang='es';localStorage.setItem('tcw_lang',lang);render()};els('export').onclick=()=>W.exportData();els('import').onclick=()=>els('file').click();els('file').onchange=async()=>{try{const n=await W.importData(els('file').files[0]);els('message').textContent=t('Imported ','Importados ')+n+t(' entries (merged with saved bills).',' registros (combinados con los guardados).');render();check()}catch(e){els('message').textContent=t('Invalid watchlist file. No changes made.','Archivo de lista inválido. No se realizaron cambios.')}els('file').value=''};els('refresh').onclick=check;window.addEventListener('tcw-watchlist-change',render);render();if(W.read().length)check();
</script></body></html>
