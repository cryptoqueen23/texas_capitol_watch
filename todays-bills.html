<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Today's Filed Bills | Texas Capitol Watchdog</title><style>:root{font-family:system-ui,sans-serif;background:#0b1120;color:#e9edf5}*{box-sizing:border-box}body{margin:0}.shell{max-width:1000px;margin:auto;padding:24px}header{background:#111a2c;border-bottom:1px solid #34415b}a{color:#f5c65d}button,input,select{font:inherit;border:1px solid #65718a;border-radius:9px;padding:12px;background:#192842;color:#fff}button{cursor:pointer}button[aria-pressed=true]{background:#f5c65d;color:#0b1120}h1{font-size:clamp(1.7rem,5vw,2.5rem)}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.tools input{flex:1;min-width:190px}.card{background:#17243a;border:1px solid #34415b;border-radius:12px;padding:18px;margin:12px 0;overflow-wrap:anywhere}.muted{color:#bac4d7}.meta{font-size:.9rem;color:#d2d9e7}.card h2{margin:0 0 8px;font-size:1.25rem}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f5c65d;outline-offset:3px}</style></head><body><header><div class="shell"><strong>★ TEXAS CAPITOL WATCHDOG</strong><p><a href="/">← <span data-en="Back to tracker" data-es="Volver al rastreador">Back to tracker</span></a></p><button id="en" aria-pressed="true">🇺🇸 EN</button> <button id="es" aria-pressed="false">🇵🇷 ES</button></div></header><main class="shell"><h1 data-en="Today's Filed Texas Bills" data-es="Proyectos presentados hoy en Texas">Today's Filed Texas Bills</h1><p data-en="Official Texas Legislature Online filing report. Filing does not mean a bill has become law." data-es="Informe oficial de proyectos presentados de la Legislatura de Texas. Presentar un proyecto no significa que sea ley.">Official Texas Legislature Online filing report. Filing does not mean a bill has become law.</p><p id="status" role="status" aria-live="polite">Loading official report…</p><div class="tools"><input id="search" type="search" aria-label="Search bills" placeholder="Search bills"><select id="chamber" aria-label="Chamber"><option value="all">All / Todos</option><option value="HB">House / Cámara</option><option value="SB">Senate / Senado</option></select></div><div id="results"></div><p><a href="https://capitol.texas.gov/reports/Report.aspx?ID=todayfiled" target="_blank" rel="noopener noreferrer" data-en="Official filing report" data-es="Informe oficial de proyectos presentados">Official filing report</a></p></main><script>const $=id=>document.getElementById(id);let lang=localStorage.getItem("tcw_lang")==="es"?"es":"en",bills=[],report=null;const tr=(en,es)=>lang==="es"?es:en;function render(){document.documentElement.lang=lang;document.querySelectorAll("[data-en]").forEach(el=>el.textContent=el.dataset[lang]);$("en").setAttribute("aria-pressed",lang==="en");$("es").setAttribute("aria-pressed",lang==="es");$("search").placeholder=tr("Search bill number, author, or topic","Buscar número, autor o tema");const q=$("search").value.toLowerCase(),ch=$("chamber").value;const matches=bills.filter(b=>(ch==="all"||b.bill.startsWith(ch))&&(b.bill+" "+b.author+" "+b.caption).toLowerCase().includes(q));$("status").textContent=report?tr(matches.length+" of "+bills.length+" bills · Source checked: "+new Date(report.checkedAt).toLocaleString("en-US"),matches.length+" de "+bills.length+" proyectos · Fuente consultada: "+new Date(report.checkedAt).toLocaleString("es-PR")):tr("Loading official report…","Cargando informe oficial…");const root=$("results");root.replaceChildren();for(const b of matches.slice(0,200)){const card=document.createElement("article");card.className="card";const h=document.createElement("h2"),a=document.createElement("a");a.href="/bill.html?bill="+encodeURIComponent(b.bill)+"&session=90R";a.textContent=b.bill;h.append(a);const meta=document.createElement("p");meta.className="meta";meta.textContent=tr("Author: ","Autor: ")+b.author+" · "+b.action;const p=document.createElement("p");p.textContent=b.caption;p.lang="en";const source=document.createElement("a");source.href=b.sourceUrl;source.target="_blank";source.rel="noopener noreferrer";source.textContent=tr("Official history","Historial oficial");card.append(h,meta,p,source);root.append(card)}if(matches.length>200){const p=document.createElement("p");p.textContent=tr("Showing first 200 matches. Narrow your search to see more.","Se muestran los primeros 200 resultados. Refina la búsqueda para ver más.");root.append(p)}}$("en").onclick=()=>{lang="en";localStorage.setItem("tcw_lang",lang);render()};$("es").onclick=()=>{lang="es";localStorage.setItem("tcw_lang",lang);render()};$("search").oninput=render;$("chamber").onchange=render;fetch("/api/todays-bills").then(async r=>{if(!r.ok)throw Error("unavailable");report=await r.json();bills=report.bills||[];render()}).catch(()=>{$("status").textContent=tr("Official filing feed unavailable. Use the official report link below.","No está disponible el informe automático. Usa el enlace oficial a continuación.")});render();</script></body></html>
