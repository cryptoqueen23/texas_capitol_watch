<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Today's Filed Bills | Texas Capitol Watchdog</title><style>:root{font-family:system-ui,sans-serif;background:#0b1120;color:#e9edf5}*{box-sizing:border-box}body{margin:0}.shell{max-width:1000px;margin:auto;padding:24px}header{background:#111a2c;border-bottom:1px solid #34415b}a{color:#f5c65d}button,input,select{font:inherit;border:1px solid #65718a;border-radius:9px;padding:12px;background:#192842;color:#fff}button{cursor:pointer}button[aria-pressed=true]{background:#f5c65d;color:#0b1120}h1{font-size:clamp(1.7rem,5vw,2.5rem)}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.tools input{flex:1;min-width:190px}.card{background:#17243a;border:1px solid #34415b;border-radius:12px;padding:18px;margin:12px 0;overflow-wrap:anywhere}.muted{color:#bac4d7}.meta{font-size:.9rem;color:#d2d9e7}.card h2{margin:0 0 8px;font-size:1.25rem}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f5c65d;outline-offset:3px} .chart-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.pie{width:220px;height:220px;border-radius:50%;flex:none;border:2px solid #61708a}.legend{flex:1;min-width:230px}.legend div{margin:7px 0}.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px}.note{font-size:.9rem;color:#bac4d7}</style></head><body><header><div class="shell"><strong>★ TEXAS CAPITOL WATCHDOG</strong><p><a href="/">← <span data-en="Back to tracker" data-es="Volver al rastreador">Back to tracker</span></a></p><button id="en" aria-pressed="true">🇺🇸 EN</button> <button id="es" aria-pressed="false">🇵🇷 ES</button></div></header><main class="shell"><h1 data-en="Today's Filed Texas Bills" data-es="Proyectos presentados hoy en Texas">Today's Filed Texas Bills</h1><p data-en="Official Texas Legislature Online filing report. Filing does not mean a bill has become law. Priority and amendment topics are automated caption-based screening, not legal conclusions." data-es="Informe oficial de proyectos presentados de la Legislatura de Texas. Presentar un proyecto no significa que sea ley. Las prioridades y los temas constitucionales se identifican automáticamente según el título, no son conclusiones legales.">Official Texas Legislature Online filing report. Filing does not mean a bill has become law.</p><p id="status" role="status" aria-live="polite">Loading official report…</p><div class="tools"><input id="search" type="search" aria-label="Search bills" placeholder="Search bills"><select id="chamber" aria-label="Chamber"><option value="all">All / Todos</option><option value="HB">House / Cámara</option><option value="SB">Senate / Senado</option></select><select id="priority" aria-label="Alert priority"><option value="all">All priorities / Todas las prioridades</option><option value="critical">Critical / Crítica</option><option value="high">High / Alta</option><option value="medium">Medium / Media</option><option value="review">Review / Revisar</option></select></div><section class="card" aria-labelledby="chart-title"><h2 id="chart-title" data-en="Bills by constitutional amendment topic" data-es="Proyectos por tema de enmienda constitucional">Bills by constitutional amendment topic</h2><p id="chart-explain" class="note"></p><div class="chart-wrap"><div id="pie" class="pie" role="img" aria-label="Bill distribution pie chart"></div><div id="legend" class="legend"></div></div></section><div id="results"></div><p><a href="https://capitol.texas.gov/reports/Report.aspx?ID=todayfiled" target="_blank" rel="noopener noreferrer" data-en="Official filing report" data-es="Informe oficial de proyectos presentados">Official filing report</a></p></main><script>const $=id=>document.getElementById(id);let lang=localStorage.getItem("tcw_lang")==="es"?"es":"en",bills=[],report=null;const tr=(en,es)=>lang==="es"?es:en;function renderChart(items){const names=tr(["First Amendment","Second Amendment","Fourth Amendment","Fifth Amendment","Sixth Amendment","Eighth Amendment","Fourteenth Amendment","Voting rights","Other / not classified"].join("|"),["Primera Enmienda","Segunda Enmienda","Cuarta Enmienda","Quinta Enmienda","Sexta Enmienda","Octava Enmienda","Decimocuarta Enmienda","Derecho al voto","Otros / sin clasificar"].join("|")).split("|");const keys=["First Amendment","Second Amendment","Fourth Amendment","Fifth Amendment","Sixth Amendment","Eighth Amendment","Fourteenth Amendment","Voting rights"];const colors=["#e0b44c","#4e9bc4","#8d7bd3","#64b49c","#cf849e","#d58c58","#a4b95b","#e37d73","#64748b"];const counts=Array(9).fill(0);for(const b of items){const found=(b.amendmentTopics||[]).map(x=>x.name);const i=keys.findIndex(k=>found.includes(k));counts[i<0?8:i]++}let sum=0;const segments=[];const legend=$("legend");legend.replaceChildren();counts.forEach((count,i)=>{if(!count)return;const percent=items.length?count/items.length*100:0;segments.push(colors[i]+" "+sum.toFixed(3)+"% "+(sum+percent).toFixed(3)+"%");sum+=percent;const line=document.createElement("div");const sw=document.createElement("span");sw.className="swatch";sw.style.background=colors[i];line.append(sw,document.createTextNode(names[i]+": "+count+" ("+percent.toFixed(1)+"%)"));legend.append(line)});$("pie").style.background=segments.length?"conic-gradient("+segments.join(",")+")":"#64748b";$("pie").setAttribute("aria-label",tr("Distribution of "+items.length+" bills by first matched constitutional-rights topic","Distribución de "+items.length+" proyectos por primer tema constitucional coincidente")) ;$("chart-explain").textContent=tr("Of "+items.length+" filtered bills. Each bill is counted once under its first caption-keyword match; other bills are unclassified. These are NOT formal constitutional amendments or legal findings. Party affiliations are not yet verified by an authoritative roster.","De "+items.length+" proyectos filtrados. Cada proyecto cuenta una vez según la primera coincidencia de palabras clave en el título; los demás no están clasificados. NO son enmiendas constitucionales formales ni conclusiones legales. Los partidos aún no se han verificado con un registro oficial.")}function render(){document.documentElement.lang=lang;document.querySelectorAll("[data-en]").forEach(el=>el.textContent=el.dataset[lang]);$("en").setAttribute("aria-pressed",lang==="en");$("es").setAttribute("aria-pressed",lang==="es");$("search").placeholder=tr("Search bill number, author, or topic","Buscar número, autor o tema");const q=$("search").value.toLowerCase(),ch=$("chamber").value,priority=$("priority").value;const matches=bills.filter(b=>(ch==="all"||b.bill.startsWith(ch))&&(priority==="all"||b.priority===priority)&&(b.bill+" "+b.author+" "+b.caption).toLowerCase().includes(q));$("status").textContent=report?(report.partial?tr("Partial Nov 9 reference list ("+bills.length+" bills). Live feed is still unavailable. Filters work on this limited list only.","Lista parcial del 9 de noviembre ("+bills.length+" proyectos). El feed en vivo sigue sin funcionar. Los filtros solo aplican a esta lista limitada."):tr(matches.length+" of "+bills.length+" bills · Source checked: "+new Date(report.checkedAt).toLocaleString("en-US"),matches.length+" de "+bills.length+" proyectos · Fuente consultada: "+new Date(report.checkedAt).toLocaleString("es-PR"))):tr("Loading official report…","Cargando informe oficial…");renderChart(matches);const root=$("results");root.replaceChildren();for(const b of matches.slice(0,200)){const card=document.createElement("article");card.className="card";const h=document.createElement("h2"),a=document.createElement("a");a.href="/bill.html?bill="+encodeURIComponent(b.bill)+"&session=90R";a.textContent=b.bill;a.addEventListener("click",()=>{try{sessionStorage.setItem("tcw_bill_"+b.session+"_"+b.bill,JSON.stringify({bill:b.bill,session:b.session,caption:b.caption,author:b.author,lastAction:b.action,sourceUrl:b.sourceUrl,checkedAt:report?.checkedAt||"",verified:true}))}catch(e){}});h.append(a);const meta=document.createElement("p");meta.className="meta";meta.textContent=tr("Author: ","Autor: ")+b.author+" · "+tr("Party: Not verified","Partido: Sin verificar")+" · "+b.action;const tag=document.createElement("p");tag.className="meta";tag.textContent=tr("Critical category (automated): ","Categoría crítica (automática): ")+(b.priority||"review").toUpperCase()+" · "+(b.amendmentTopics||[]).map(x=>x.name).join(", ")+(b.constitutionalProposal?" · "+tr("Proposed constitutional amendment","Enmienda constitucional propuesta"):"");const p=document.createElement("p");p.textContent=b.caption;p.lang="en";const source=document.createElement("a");source.href=b.sourceUrl;source.target="_blank";source.rel="noopener noreferrer";source.textContent=tr("Official history","Historial oficial");card.append(h,meta,tag,p,source);root.append(card)}if(matches.length>200){const p=document.createElement("p");p.textContent=tr("Showing first 200 matches. Narrow your search to see more.","Se muestran los primeros 200 resultados. Refina la búsqueda para ver más.");root.append(p)}}$("en").onclick=()=>{lang="en";localStorage.setItem("tcw_lang",lang);render()};$("es").onclick=()=>{lang="es";localStorage.setItem("tcw_lang",lang);render()};$("search").oninput=render;$("chamber").onchange=render;$("priority").onchange=render;fetch("/api/todays-bills").then(async r=>{if(!r.ok)throw Error("unavailable");report=await r.json();bills=report.bills||[];render()}).catch(()=>{$("status").textContent=tr("Official filing feed unavailable. Use the official report link below.","No está disponible el informe automático. Usa el enlace oficial a continuación.")});render();</script></body></html>
